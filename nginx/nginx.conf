server {
  listen 443 ssl;
  server_name localhost;
  # Keep this in sync with FILE_UPLOAD_MAX_TOTAL_SIZE_MB in admin settings.
  client_max_body_size 75m;

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  # Aurelle sends its own security headers (Content-Security-Policy, HSTS, X-Frame-Options, ...).
  # Do not add_header them here: a second Content-Security-Policy is intersected with the app's.
  # See docs/Security-Headers.md.
  location /api/events {
    proxy_pass http://songbird:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The app takes the visitor's address from here ("trust proxy" = 1); without
    # it every visitor looks like this nginx container.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no;
  }

  location / {
    proxy_pass http://songbird:5174;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  return 301 https://$host$request_uri;
}
