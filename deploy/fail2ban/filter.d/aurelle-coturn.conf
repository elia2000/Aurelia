# fail2ban filter: one client opening an unusual number of TURN sessions
# (allocation flood, scanner, a script retrying bad credentials).
#
# coturn does NOT log the client address on a failed login ("check_stun_auth:
# Cannot find credentials of user <...>" and "incoming packet ... error 401" carry
# no address, checked with coturn 4.6.1). The one line that does is written when a
# session ends, and only when coturn runs with `verbose`:
#
#   2026-10-23T11:30:25+0000: session 003000000000000003: closed (2nd stage), user <1792791167:mallory> realm <aurelle.d4> origin <>, local 127.0.0.1:3499, remote 127.0.0.1:43994, reason: allocation watchdog determined stale session state
#
# Every ended session counts, good or bad, so the jail uses a high limit (see
# jail.d/aurelle.local). IPv6 clients are written as [addr]:port.
#
# Works on the journal (the installer's turnserver.conf has `syslog`; add `verbose`),
# on `docker logs` files and on a coturn log file: the pattern is not anchored.

[Definition]

failregex = session \d{18}: closed \(2nd stage\), user <[^>]*> realm <[^>]*> origin <[^>]*>, local \S+, remote \[?<ADDR>\]?:\d+, reason: 

ignoreregex =
