# fail2ban filter: a flood of error responses from nginx (scanners, API
# enumeration, a script hammering a rate limit).
#
# Reads nginx's access log in the default "combined" format that the installer's
# site file uses (it sets no access_log or log_format of its own):
#
#   203.0.113.9 - - [23/Oct/2026:11:30:25 +0000] "GET /api/thing HTTP/1.1" 429 178 "-" "curl/8.5.0"
#
# Counted: 400 403 404 405 408 414 429. 401 is left out on purpose: a visitor who is
# not signed in gets one on every page load. Failed sign-ins are the job of the
# aurelle-auth jail.
#
# The address is the first field ($remote_addr). nginx writes a double quote inside
# a request or user agent as \x22, so a client can not break out of its field.
# Behind a CDN this is the CDN address unless the real IP module is set up (see
# docs/Fail2ban.md); do not use this jail then.

[Definition]

failregex = ^<ADDR> \S+ \S+ \[[^\]]*\] "[^"]*" (?:400|403|404|405|408|414|429) \d+

ignoreregex =
