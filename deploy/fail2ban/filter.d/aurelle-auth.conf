# fail2ban filter: failed sign-ins to the Aurelle app.
#
# The server writes one line for every wrong password / wrong 2FA code
# (server/lib/authFailureLog.js):
#
#   2026-10-23T11:30:25.646Z [auth] auth_failed ip=203.0.113.9 user=b5fcabbe2af0 reason=credentials
#
# `ip` is the client address Express resolves (req.ip, "trust proxy" = 1, i.e. the
# address nginx saw). It is `unknown` when that is not a valid address, which
# <ADDR> does not match, so such a line never bans anything. The account name is
# never in the line (only a keyed hash), so there is nothing to capture for it.
#
# Works on the journal (backend = systemd), on `docker logs` files and on a plain
# log file: the pattern is not anchored, so any prefix is fine.

[Definition]

failregex = \[auth\] auth_failed ip=<ADDR>(?: |$)

ignoreregex =

# Tested with:
#   fail2ban-regex --journalmatch '_SYSTEMD_UNIT=songbird.service' systemd-journal /etc/fail2ban/filter.d/aurelle-auth.conf
