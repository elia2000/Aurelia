services:
  songbird:
    # Aurelle is built from this source tree: calls, video messages and the new
    # branding are not in the upstream Songbird image on Docker Hub.
    # To use a prebuilt image of your own instead, remove the `build` block and
    # set SONGBIRD_IMAGE to it.
    image: ${SONGBIRD_IMAGE:-aurelle:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songbird
    restart: unless-stopped
    expose:
      - "${SERVER_PORT:-5174}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-5174}
      BIND_ADDRESS: "0.0.0.0"
      DB_CLIENT: ${DB_CLIENT:-sqlite3}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-songbird}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Tell the admin panel which container to use via the Docker API.
      # Defaults to "songbird" which matches the container_name above.
      SONGBIRD_CONTAINER_NAME: ${SONGBIRD_CONTAINER_NAME:-songbird}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WORKER_PORT: ${WORKER_PORT:-8080}
      STORAGE_PROCESSING_MODE: ${STORAGE_PROCESSING_MODE:-auto}
      WORKER_URL: ${WORKER_URL:-${MEDIA_WORKER_URL:-}}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - songbird-data:/app/data
      # Required for the admin panel's services.
      # The container uses the Docker Engine API (via this socket) to control itself.
      # Remove this mount if you do not need service control from the admin panel.
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-443}:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    # Wait for the app to pass its healthcheck before nginx starts accepting traffic.
    # This avoids 502s during the brief startup window (migrations, WASM init).
    depends_on:
      songbird:
        condition: service_healthy

  # TURN/STUN relay for voice and video calls (optional, enable with
  #   docker compose --profile calls up -d
  # and set CALLS_TURN_SECRET, CALLS_TURN_URLS and CALLS_TURN_EXTERNAL_IP (all
  # three are required) in .env).
  # Calls are end-to-end encrypted and peer-to-peer; the relay is only used when
  # a direct path is impossible (strict NAT / carrier networks) and only ever
  # forwards ciphertext. Host networking is used so the UDP relay range works
  # without publishing hundreds of ports.
  coturn:
    profiles: ["calls"]
    image: coturn/coturn:4.6-alpine
    container_name: aurelle-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--realm=${CALLS_TURN_REALM:-aurelle}"
      - "--listening-port=${CALLS_TURN_PORT:-3478}"
      - "--use-auth-secret"
      - "--static-auth-secret=${CALLS_TURN_SECRET:-}"
      - "--external-ip=${CALLS_TURN_EXTERNAL_IP:-}"
      - "--min-port=${CALLS_TURN_MIN_PORT:-49160}"
      - "--max-port=${CALLS_TURN_MAX_PORT:-49260}"
      - "--fingerprint"
      - "--no-cli"
      - "--no-multicast-peers"
      - "--no-software-attribute"
      - "--no-tlsv1"
      - "--no-tlsv1_1"
      # Never let the relay reach private networks or the host itself.
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      # The same for IPv6, including IPv4 addresses written as IPv6 (::ffff:a.b.c.d
      # and the NAT64 prefix) which would otherwise slip past the ranges above.
      - "--denied-peer-ip=::-::"
      - "--denied-peer-ip=::1-::1"
      - "--denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff"
      - "--denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff"
      - "--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      # Keep a single user from exhausting the relay.
      - "--user-quota=${CALLS_TURN_USER_QUOTA:-6}"
      - "--total-quota=${CALLS_TURN_TOTAL_QUOTA:-200}"
      - "--max-bps=${CALLS_TURN_MAX_BPS:-262144}"

